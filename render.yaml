services:
  - type: web
    name: atlas-18-api
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -e .
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
    autoDeployTrigger: checksPass
    envVars:
      - key: ATLAS_ENVIRONMENT
        value: production
      - key: ATLAS_API_TOKEN
        generateValue: true
      - key: ATLAS_DATABASE_URL
        fromDatabase:
          name: atlas-postgres
          property: connectionString
      - key: ATLAS_CORS_ORIGINS
        value: "*"

  - type: web
    name: atlas-18-mobile
    runtime: static
    rootDir: apps/mobile
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: atlas-postgres
    plan: free
    region: virginia
