name: ATLAS Research Intake

on:
  push:
    branches:
      - atlas-research-data
    paths:
      - docs/research/intake/*.json
      - .github/workflows/research-intake.yml
  workflow_dispatch:

# Changes to this workflow deliberately reconcile every archived package.
permissions:
  contents: read
  id-token: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          ATLAS_API_URL: https://atlas-18-api.onrender.com
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const commit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha
            });
            const changedPaths = [...new Set([
              ...(context.payload.commits || []).flatMap((item) => [...(item.added || []), ...(item.modified || [])]),
              ...(commit.data.files || []).map((file) => file.filename)
            ])];
            const reconcileAll = context.eventName === 'workflow_dispatch' || changedPaths.includes('.github/workflows/research-intake.yml');
            const intakeDir = 'docs/research/intake';
            const allPaths = fs.readdirSync(intakeDir)
              .filter((name) => name.endsWith('.json'))
              .map((name) => path.posix.join(intakeDir, name));
            const paths = (reconcileAll ? allPaths : changedPaths)
              .filter((name) => name.startsWith('docs/research/intake/') && name.endsWith('.json'))
              .sort();
            core.info(`${reconcileAll ? 'Reconciliation' : 'Incremental intake'}: ${paths.length} package(s)`);
            for (const path of paths) {
              const payload = JSON.parse(fs.readFileSync(path, 'utf8'));
              payload.archive_path = path;
              payload.archive_commit = context.sha;
              payload.workflow_run_id = String(context.runId);
              payload.workflow_run_url = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${context.runId}`;
              const token = await core.getIDToken('atlas-research-intake');
              const response = await fetch(`${process.env.ATLAS_API_URL}/research/github-intake`, {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${token}`,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
              });
              if (!response.ok) {
                const body = await response.text();
                throw new Error(`ATLAS intake failed for ${path}: HTTP ${response.status} ${body}`);
              }
              const result = await response.json();
              core.info(`${payload.batch_id}: package=${result.package?.status}, inserted=${result.inserted}, duplicates=${result.duplicates}, findings=${result.received}`);
            }
