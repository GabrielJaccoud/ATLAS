[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-futures"
version = "1.9.0"
description = "ATLAS — Sistema de Inteligência Causal, Pessoal, Experimental e Operacional"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.2,<6.0",
  "python-multipart>=0.0.20,<1.0",
  "httpx>=0.28,<1.0",
  "pywebpush>=2.0,<3.0",
  "cryptography>=44,<47",
  "reportlab>=4.2,<5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff>=0.9,<1.0",
  "mypy>=1.14,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["atlas", "apps"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
